# Config as code do Railway. Cobre apenas build e deploy.
# ATENCAO: volume NAO se declara aqui (nao existe chave volumes no schema).
# O volume em /data precisa ser criado pela CLI (railway volume add
# --mount-path /data) ou pelo dashboard (Cmd+K > Add Volume). Sem ele, o
# certificado .pfx e o banco SQLite somem a cada redeploy.

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
